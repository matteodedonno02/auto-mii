<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Editor di Mii Wii: modifica ogni campo del formato RCD/RSD con anteprima dal vivo, importa ed esporta file .mii e .rsd."
    />
    <meta name="theme-color" content="#F3F3F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)" />
    <title>Mii Builder</title>
    <script>
      try {
        var stored = localStorage.getItem('mii-builder.theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        }
      } catch (error) {
        /* storage unavailable: follow the system theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
